<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#0b2a40"/>
      <stop offset="100%" stop-color="#0b3d5c"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00d4ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .name { font: 700 64px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: 1px;
              opacity: 0; animation: up 1s ease-out .2s forwards; }
      .role { font: 500 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9fe9ff;
              opacity: 0; animation: up 1s ease-out .7s forwards; }
      .tag  { font: 500 15px 'Consolas', 'Courier New', monospace; fill: #00ff88;
              opacity: 0; animation: up 1s ease-out 1.1s forwards; }
      .w1 { animation: drift 9s ease-in-out infinite alternate; }
      .w2 { animation: drift 13s ease-in-out infinite alternate-reverse; }
      .dot { animation: blink 1.6s ease-in-out infinite; }
      @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-120px); } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    </style>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>

  <!-- pulse line, like the IncidentSense logo -->
  <path d="M40 128 h90 l22 -46 l36 108 l26 -78 l16 34 h20" fill="none" stroke="#00d4ff" stroke-opacity=".35"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1160 128 h-90 l-22 46 l-36 -108 l-26 78 l-16 -34 h-20" fill="none" stroke="#00ff88" stroke-opacity=".25"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="600" y="112" text-anchor="middle" class="name">Pratham Ahuja</text>
  <text x="600" y="152" text-anchor="middle" class="role">Backend Engineer  ·  Java and Spring Boot  ·  AI-assisted systems</text>
  <g class="tag">
    <circle cx="482" cy="182" r="5" fill="#00ff88" class="dot"/>
    <text x="496" y="187">open to SDE Intern / New-Grad 2027</text>
  </g>

  <g class="w2" opacity=".35">
    <path d="M0 230 C150 205 300 255 450 230 S750 205 900 230 S1200 255 1350 230 V260 H0 Z" fill="url(#wave)"/>
  </g>
  <g class="w1" opacity=".75">
    <path d="M0 242 C120 228 240 258 360 242 S600 226 720 242 S960 258 1080 242 S1260 230 1340 240 V260 H0 Z" fill="url(#wave)"/>
  </g>
</svg>
