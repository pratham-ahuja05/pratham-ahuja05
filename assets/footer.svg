<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <style>
      .t { font: 500 18px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9f6ff; }
      .w1 { animation: drift 10s ease-in-out infinite alternate; }
      .w2 { animation: drift 14s ease-in-out infinite alternate-reverse; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-120px); } }
    </style>
  </defs>
  <g class="w2" opacity=".35">
    <path d="M0 40 C150 15 300 65 450 40 S750 15 900 40 S1200 65 1350 40 V120 H0 Z" fill="url(#wave)"/>
  </g>
  <g class="w1" opacity=".8">
    <path d="M0 55 C120 40 240 70 360 55 S600 40 720 55 S960 70 1080 55 S1260 42 1340 52 V120 H0 Z" fill="url(#wave)"/>
  </g>
  <text x="600" y="98" text-anchor="middle" class="t" fill-opacity="1" style="fill:#0d1117;font-weight:600">Happy to talk backend, queues or AI pipelines.</text>
</svg>
